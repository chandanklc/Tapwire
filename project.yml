name: Tapwire
options:
  bundleIdPrefix: app.tapwire
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  swift-nio:
    url: https://github.com/apple/swift-nio.git
    from: "2.65.0"
  swift-nio-ssl:
    url: https://github.com/apple/swift-nio-ssl.git
    from: "2.27.0"
  swift-nio-extras:
    url: https://github.com/apple/swift-nio-extras.git
    from: "1.22.0"
  swift-certificates:
    url: https://github.com/apple/swift-certificates.git
    from: "1.5.0"
  swift-crypto:
    url: https://github.com/apple/swift-crypto.git
    from: "3.7.0"
  swift-asn1:
    url: https://github.com/apple/swift-asn1.git
    from: "1.1.0"

targets:
  TapwireCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/TapwireCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tapwire.core
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
    dependencies:
      - package: swift-nio
        product: NIOCore
      - package: swift-nio
        product: NIOPosix
      - package: swift-nio
        product: NIOHTTP1
      - package: swift-nio
        product: NIOTLS
      - package: swift-nio
        product: NIOConcurrencyHelpers
      - package: swift-nio
        product: NIOFoundationCompat
      - package: swift-nio-ssl
        product: NIOSSL
      - package: swift-nio-extras
        product: NIOExtras
      - package: swift-certificates
        product: X509
      - package: swift-crypto
        product: Crypto
      - package: swift-asn1
        product: SwiftASN1
      - sdk: Compression.framework
      - sdk: Security.framework

  Tapwire:
    type: application
    platform: macOS
    sources:
      - path: Sources/Tapwire
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tapwire.Tapwire
        PRODUCT_NAME: Tapwire
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    info:
      path: Sources/Tapwire/Info.plist
      properties:
        CFBundleDisplayName: Tapwire
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "Copyright © 2026 Tapwire"
        NSLocalNetworkUsageDescription: "Tapwire forwards debugged traffic to servers on your local network and accepts proxy connections from devices on your Wi-Fi."
        NSAppleEventsUsageDescription: "Tapwire uses an administrator prompt to change the macOS system proxy settings."
        CFBundleDocumentTypes:
          - CFBundleTypeName: Tapwire Session
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [app.tapwire.session]
          - CFBundleTypeName: HTTP Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [app.tapwire.har]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: app.tapwire.session
            UTTypeDescription: Tapwire Session
            UTTypeConformsTo: [public.json, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [tapwire]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: app.tapwire.har
            UTTypeDescription: HTTP Archive
            UTTypeConformsTo: [public.json, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [har]
    dependencies:
      - target: TapwireCore
        embed: true
    scheme:
      testTargets:
        - TapwireCoreTests
      gatherCoverageData: false

  TapwireCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/TapwireCoreTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tapwire.core.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: TapwireCore
