name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Tapwire version
      placeholder: "1.1.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS 15.2, Apple silicon"
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Client
      options:
        - iPhone / iPad
        - iOS Simulator
        - Android phone
        - Android emulator
        - This Mac (browser or app)
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Turn on SSL Proxying for api.example.com
        2. Open the app on the phone
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, logs or HAR export
      description: Remove tokens, cookies and passwords first.
